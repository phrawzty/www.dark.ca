base_url = "https://dark.ca"
title = "Daniel \"phrawzty\" Maher"
description = "Senior Security Advocate at Datadog, DevOpsDays core member, open source developer."
theme = "terminus"

author = "Dan Maher"

[markdown.highlighting]
theme = "nord"
style = "class"

[extra]
color_scheme = "terminus"
copyright = "© $YEAR Dan Maher"
show_default_author = false
fediverse_creator = "@phrawzty@hachyderm.io"

main_menu = [
    { name = "portfolio", url = "https://speaking.dark.ca/" },
    { name = "blog", url = "https://blog.dark.ca/" },
    { name = "travels", url = "/travels/", trailing_slash = true },
]

# Allow CARTO basemap tiles for the /travels/ map. The terminus theme enables
# CSP by default (default-src 'self'); without this, tile <img> requests are
# blocked because img-src falls back to default-src.
[[extra.content_security_policy.allowed_domains]]
directive = "img-src"
domains = ["'self'", "https://*.basemaps.cartocdn.com"]
